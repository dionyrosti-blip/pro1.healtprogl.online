<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <title>GLPro Special Offer | Discounted Packages</title>
  <meta name="description" content="Choose your discounted GLPro package.">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #172235;
      --teal: #2f7d94;
      --teal-dark: #126c7a;
      --red: #ed1d24;
      --page: #f4f5f6;
      --line: #d5d9de;
      --yellow: #ffec16;
      --white: #ffffff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--page);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--navy);
      -webkit-font-smoothing: antialiased;
    }

    .offer-page {
      width: 100%;
      padding: 8px 24px 24px;
    }

    .headline {
      text-align: center;
      font-size: clamp(28px, 2.65vw, 38px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -0.7px;
      margin: 0 auto 38px;
    }

    .headline .brand {
      color: var(--teal);
    }

    .plans {
      width: min(1218px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      align-items: stretch;
    }

    .plan {
      position: relative;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 18px;
      min-height: 815px;
      padding: 32px 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .plan.best {
      border: 2px solid var(--teal);
      padding-top: 68px;
    }

    .best-ribbon {
      position: absolute;
      top: 0;
      left: 24px;
      right: 24px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--teal);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.4px;
    }

    .plan-title {
      text-align: center;
      font-size: clamp(22px, 1.8vw, 27px);
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 0.2px;
      margin-bottom: 22px;
    }

    .product-wrap {
      width: 100%;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .best .product-wrap {
      height: 285px;
      margin-bottom: 2px;
    }

    .product-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 11px;
      margin: 5px 0 12px;
      white-space: nowrap;
    }

    .price {
      font-size: clamp(54px, 5vw, 67px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .per-pack {
      color: var(--red);
      font-size: 20px;
      font-weight: 900;
    }

    .cart-button {
      width: 100%;
      min-height: 96px;
      border-radius: 18px;
      border: 3px solid #555;
      background: #fff;
      color: #191919;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 14px 14px;
      text-decoration: none;
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(31px, 3vw, 42px);
      line-height: 1;
      letter-spacing: 0.4px;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .cart-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 18px rgba(0,0,0,.12);
    }

    .best .cart-button {
      border-color: var(--teal-dark);
      background: linear-gradient(180deg, #fff129 0%, #ffe915 100%);
      color: var(--teal-dark);
      box-shadow: 0 0 0 2px rgba(47,125,148,.18), 0 4px 10px rgba(0,0,0,.10);
    }

    .cart-icon {
      font-family: Arial, Helvetica, sans-serif;
      font-size: .95em;
      font-weight: 700;
      line-height: 1;
      transform: translateY(-1px);
    }

    .shipping {
      color: var(--red);
      font-size: 17px;
      font-weight: 900;
      text-align: center;
      margin-top: 24px;
      min-height: 20px;
    }

    .best .shipping {
      margin-top: 66px;
    }

    .payment-logos {
      width: min(265px, 86%);
      height: auto;
      display: block;
      margin: 14px auto 17px;
    }

    .total {
      text-align: center;
      font-size: 21px;
      font-weight: 900;
      line-height: 1.15;
      white-space: nowrap;
    }

    .total-label {
      color: #25718b;
      margin-right: 7px;
    }

    .old-total {
      color: var(--red);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      margin-right: 8px;
    }

    .new-total {
      color: var(--navy);
    }

    @media (max-width: 1050px) {
      .offer-page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .plans {
        gap: 14px;
      }

      .plan {
        padding-left: 18px;
        padding-right: 18px;
      }

      .best-ribbon {
        left: 16px;
        right: 16px;
      }
    }

    @media (max-width: 820px) {
      .offer-page {
        padding-top: 18px;
        padding-bottom: 36px;
      }

      .headline {
        margin-bottom: 24px;
      }

      .plans {
        grid-template-columns: 1fr;
        max-width: 460px;
      }

      .plan {
        min-height: auto;
        padding: 30px 22px 28px;
      }

      .plan.best {
        order: -1;
        padding-top: 66px;
      }

      .product-wrap,
      .best .product-wrap {
        height: 275px;
        margin-bottom: 4px;
      }

      .best .shipping {
        margin-top: 28px;
      }

      .cart-button {
        min-height: 88px;
      }
    }

    @media (max-width: 430px) {
      .offer-page {
        padding-left: 10px;
        padding-right: 10px;
      }

      .headline {
        font-size: 28px;
      }

      .plan {
        border-radius: 15px;
        padding-left: 16px;
        padding-right: 16px;
      }

      .plan-title {
        font-size: 22px;
      }

      .product-wrap,
      .best .product-wrap {
        height: 235px;
      }

      .price {
        font-size: 58px;
      }

      .cart-button {
        font-size: 34px;
        min-height: 82px;
        border-radius: 15px;
      }

      .shipping {
        font-size: 16px;
      }

      .total {
        font-size: 20px;
      }
    }

    /* ===== PROFESSIONAL VISUAL UPGRADE ===== */
    body {
      background:
        radial-gradient(circle at 50% -180px, rgba(47,125,148,.10), transparent 420px),
        #f7f9fb;
    }

    .offer-page {
      max-width: 1320px;
      margin: 0 auto;
      padding: 34px 28px 58px;
    }

    .headline {
      max-width: 760px;
      font-size: clamp(30px, 3vw, 42px);
      line-height: 1.08;
      letter-spacing: -1px;
      margin: 0 auto 42px;
      color: #172235;
    }

    .headline .brand {
      position: relative;
      display: inline-block;
      color: var(--teal);
    }

    .plans {
      width: min(1180px, 100%);
      gap: 22px;
      align-items: stretch;
    }

    .plan {
      min-height: 760px;
      padding: 34px 28px 30px;
      border: 1px solid rgba(23,34,53,.12);
      border-radius: 20px;
      box-shadow:
        0 2px 5px rgba(23,34,53,.04),
        0 14px 38px rgba(23,34,53,.07);
      transition:
        transform .22s ease,
        box-shadow .22s ease,
        border-color .22s ease;
    }

    .plan:hover {
      transform: translateY(-4px);
      box-shadow:
        0 4px 10px rgba(23,34,53,.05),
        0 20px 48px rgba(23,34,53,.11);
      border-color: rgba(47,125,148,.35);
    }

    .plan.best {
      border: 2px solid var(--teal);
      padding-top: 72px;
      box-shadow:
        0 5px 15px rgba(47,125,148,.10),
        0 22px 55px rgba(23,34,53,.13);
      transform: translateY(-8px);
    }

    .plan.best:hover {
      transform: translateY(-12px);
    }

    .best-ribbon {
      left: 0;
      right: 0;
      height: 46px;
      border-radius: 18px 18px 0 0;
      font-size: 15px;
      letter-spacing: 1.1px;
      text-transform: uppercase;
    }

    .plan-title {
      font-size: clamp(21px, 1.7vw, 26px);
      line-height: 1.15;
      letter-spacing: .2px;
      margin-bottom: 18px;
      color: #172235;
    }

    .product-wrap {
      height: 245px;
      margin-bottom: 8px;
    }

    .best .product-wrap {
      height: 270px;
      margin-bottom: 0;
    }

    .product-image {
      filter: drop-shadow(0 12px 15px rgba(23,34,53,.10));
      transition: transform .22s ease;
    }

    .plan:hover .product-image {
      transform: translateY(-2px) scale(1.015);
    }

    .price-row {
      gap: 8px;
      margin: 6px 0 18px;
    }

    .price {
      font-size: clamp(54px, 5vw, 66px);
      line-height: .92;
      letter-spacing: -2.5px;
      color: #0f172a;
    }

    .per-pack {
      font-size: 16px;
      letter-spacing: .1px;
    }

    .cart-button {
      min-height: 78px;
      border-radius: 14px;
      border: 2px solid #3f4650;
      padding: 13px 18px;
      gap: 12px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(24px, 2.2vw, 32px);
      font-weight: 900;
      letter-spacing: .15px;
      box-shadow:
        inset 0 -2px 0 rgba(0,0,0,.04),
        0 5px 14px rgba(23,34,53,.08);
    }

    .cart-button:hover {
      transform: translateY(-2px);
      box-shadow:
        inset 0 -2px 0 rgba(0,0,0,.04),
        0 10px 22px rgba(23,34,53,.13);
    }

    .best .cart-button {
      border-color: #188397;
      background: linear-gradient(180deg, #fff42b 0%, #ffe51a 100%);
      color: #126c7a;
      box-shadow:
        0 0 0 3px rgba(47,125,148,.10),
        0 8px 20px rgba(23,34,53,.12);
    }

    .cart-icon {
      font-size: .85em;
    }

    .shipping {
      margin-top: 20px;
      font-size: 14px;
      letter-spacing: .3px;
    }

    .best .shipping {
      margin-top: 28px;
    }

    .payment-logos {
      width: min(245px, 82%);
      margin: 12px auto 14px;
      opacity: .92;
    }

    .total {
      margin-top: auto;
      padding-top: 8px;
      font-size: 18px;
      line-height: 1.2;
    }

    .total-label {
      color: #2f7d94;
    }

    .old-total {
      opacity: .78;
    }

    .new-total {
      font-weight: 900;
      color: #172235;
    }

    @media (max-width: 1050px) {
      .offer-page {
        padding-left: 18px;
        padding-right: 18px;
      }

      .plans {
        gap: 16px;
      }

      .plan {
        padding-left: 20px;
        padding-right: 20px;
      }

      .plan.best {
        transform: translateY(-5px);
      }
    }

    @media (max-width: 820px) {
      .offer-page {
        padding-top: 26px;
        padding-bottom: 42px;
      }

      .headline {
        margin-bottom: 28px;
      }

      .plans {
        max-width: 500px;
        gap: 18px;
      }

      .plan,
      .plan.best {
        min-height: auto;
        transform: none;
      }

      .plan:hover,
      .plan.best:hover {
        transform: translateY(-3px);
      }

      .plan.best {
        padding-top: 68px;
      }

      .product-wrap,
      .best .product-wrap {
        height: 255px;
      }

      .cart-button {
        min-height: 76px;
      }

      .total {
        margin-top: 0;
      }
    }

    @media (max-width: 430px) {
      .offer-page {
        padding: 22px 12px 36px;
      }

      .headline {
        font-size: 29px;
        line-height: 1.12;
      }

      .plan {
        border-radius: 17px;
        padding-left: 17px;
        padding-right: 17px;
      }

      .best-ribbon {
        border-radius: 15px 15px 0 0;
      }

      .product-wrap,
      .best .product-wrap {
        height: 225px;
      }

      .price {
        font-size: 56px;
      }

      .cart-button {
        min-height: 72px;
        border-radius: 13px;
        font-size: 28px;
      }
    }

  </style>
</head>
